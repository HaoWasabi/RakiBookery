name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main # Chạy tự động mỗi khi push code hoặc merge PR vào branch main

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: rakibookery/php-app             # Tên ECR Repository
  ECS_CLUSTER: rakibookery-prod-cluster           # Tên ECS Cluster
  ECS_SERVICE: rakibookery-prod-service           # Tên ECS Service
  ECS_TASK_DEFINITION: rakibookery-prod-app       # Tên Task Definition family
  CONTAINER_NAME: php-app                         # Tên container trong Task Definition

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image-output.outputs.image }}

    steps:
    # 1. Checkout mã nguồn từ GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Cấu hình credentials kết nối tới AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3. Đăng nhập vào Amazon ECR
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Build Docker Image và Push lên ECR
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build image từ Dockerfile
        docker build \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

        # Push image lên ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # 5. Truyền image URI sang job deploy
    - name: Set image output
      id: set-image-output
      run: |
        echo "image=${{ steps.build-image.outputs.image }}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # Job 2: Deploy image mới lên Amazon ECS
  # Chạy ngay sau khi build-and-push thành công
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Amazon ECS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    # 1. Cấu hình credentials AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 2. Lấy task definition hiện tại từ ECS
    - name: Download current ECS task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ env.ECS_TASK_DEFINITION }} \
          --query 'taskDefinition' \
          --output json > task-def.json
        echo "✅ Task definition downloaded"

    # 3. Render task definition mới với image vừa build
    - name: Render new task definition with updated image
      id: render-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-def.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ needs.build-and-push.outputs.image }}

    # 4. Đăng ký task definition mới và deploy lên ECS Service
    #    - Nếu service đang chạy task cũ, ECS sẽ tạo task mới (rolling update)
    #      rồi drain và dừng task cũ sau khi task mới healthy
    #    - wait-for-service-stability: true → chờ đến khi service ổn định hẳn
    - name: Deploy new task definition to ECS Service
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    - name: Deployment complete
      run: echo "🚀 ECS deployment successful – new task is running the latest ECR image"