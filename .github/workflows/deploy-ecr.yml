name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main # Chạy tự động mỗi khi push code hoặc merge PR vào branch main

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn từ GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Cấu hình credentials kết nối tới AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1 # Thay bằng AWS Region của bạn (ví dụ: ap-southeast-1)

    # 3. Đăng nhập vào Amazon ECR
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Build Docker Image và Push lên ECR
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: rakibookery/php-app # Thay tên ECR Repository của bạn ở đây
        IMAGE_TAG: ${{ github.sha }} # Dùng Git SHA để làm tag duy nhất (hoặc 'latest')
      run: |
        # Build image từ Dockerfile
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        # Push image lên ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest